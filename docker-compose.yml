services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    env_file: .env
    expose:
      - "8000"
    deploy:
      replicas: 2
    restart: unless-stopped
    stop_grace_period: 60s

  app:
    build:
      context: .
      target: streamlit
    env_file: .env
    expose:
      - "8501"
    restart: unless-stopped
    stop_grace_period: 60s
